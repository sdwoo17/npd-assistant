name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install 'cfn-lint>=1.30,<2'
      - run: cfn-lint infra/pilot.json
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: python -m compileall -q app manage.py scripts
      - run: node --check static/app.js
      - run: node --check static/planning.js
      - run: python scripts/regression.py --passes 3 --browser
      - name: Build container and verify local HTTP startup
        run: |
          docker build -t npd-assistant:ci .
          docker run --rm --entrypoint python npd-assistant:ci -c "from scripts.live_validation import run_workflow; from scripts.https_validation import run_remote; from scripts.pilot_ops import main; from scripts.register_persona_templates import register; from scripts.evaluate_retrieval import evaluate; from scripts.bootstrap_pilot import initialize; from scripts.bedrock_check import check; from app.model import BedrockModel; result, code = check(BedrockModel(model=''), live=False); assert code == 2 and not result['live_call']"
          docker volume create npd-ci-data
          docker run --rm -v npd-ci-data:/data npd-assistant:ci demo
          docker run -d --name npd-ci -p 127.0.0.1:8765:8765 -v npd-ci-data:/data npd-assistant:ci
          python scripts/container_smoke.py
      - name: Cleanup container
        if: always()
        run: |
          docker rm -f npd-ci || true
          docker volume rm npd-ci-data || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-results
          path: test-results/
